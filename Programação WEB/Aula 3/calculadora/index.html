<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEV-CALC</title>
    <link rel="stylesheet" href="./estilos/index.css">
</head>
<body>
    <!--Primeira divisão maior, campo dos números.-->
    <div class="numeros">
        <!--Primeiro campo de números-->
        <div class="num1">
            <input id="num1" type="number" placeholder="Digite um número">
        </div>
        <!--Segundo campo de números-->
        <div class="num2">
            <input id="num2" type="number" placeholder="Digite um número">
        </div>
    </div>
    <!--Segunda divisão maior, campo dos operadores.-->
    <div class="operadores">
        <!--Botão de soma-->
        <div class="soma">
            <button id="soma" class="btnSoma">SOMA (+)</button>
        </div>
        <!--Botão de subtração-->
        <div class="subtrai">
            <button id="subtrai" class="btnSubtrai">SUBTRAI (-)</button>
        </div>
        <!--Botão de multiplicação-->
        <div class="multiplica">
            <button id="multiplica" class="btnMulti">MULTIPLICA (x)</button>
        </div>
        <!--Botão de divisão-->
        <div class="divide">
            <button id="divide" class="btnDivide">DIVIDE (÷)</button>
        </div>
    </div>
    <!--Terceira divisão maior, campo dos botões (limpar e confirmar).-->
    <!--Botão limpar-->
    <div class="limpar">
        <button id="btnLimpar">LIMPAR</button>
    </div>
    <!--Botão confirmar-->
    <div class="confirmar">
            <button id="btnConfirmar">CONFIRMAR</button>
    </div>
    <!--Resultado-->
    <div class="resultado">
        <label id="resultado">1234</label>
    </div>
    <script src="./js/index.js"
                defer></script>
</body>
</html>
