<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMULÁRIO</title>
    <link rel="stylesheet" href="./estilos/index.css">
</head>
<body>
    <div class="card">
        <!--Texto de boas vindas-->
        <div class="texto">
            <label>Bem vindo! Faça seu cadastro.</label>
        </div>
        <div class="inputs">
            <!--Input para digitar o nome-->
            <div>
                <input type = "text" placeholder="Digite seu nome" id = iptNome class="iptNome">
            </div>
            <!--Input para digitar o senha-->
            <div>
                <input type = "password" placeholder="Digite sua senha" id = iptSenha class="iptSenha">
            </div>
            <!--Input para confirmar a sua senha-->
            <div>
                <input type = "password" placeholder="Confirme a sua senha" id = iptCSenha class="iptCSenha">
            </div>
            <!--Input para digitar o gênero-->
            <div>
                <input type = "text" placeholder="Digite seu gênero" id = iptGen class="iptGen">
            </div>
            <!--Input para digitar a idade-->
            <div>
                <input type = "number" placeholder="Digite sua idade" id = iptIdd class="iptIdd">
            </div>
            <!--Input para digitar o email-->
            <div>
                <input type = "email" placeholder="Digite seu email" id = iptEmail class="iptEmail">
            </div>
            <!--Input para digitar o numero-->
            <div>
                <input type = "number" placeholder="Digite seu número" id = iptNum class="iptNum">
            </div>
        </div>
        <!--Botão que confirma o cadastro.-->
        <div class="btn">   
            <button class="button" id="btnConfirmar">Confirmar!</button>
        </div>
    </div>
    <script src="./codigo/index.js" defer>
    </script> 
</body>
</html>
