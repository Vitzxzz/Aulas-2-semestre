<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../estilos/index.css">
        <title>CADASTRO</title>
    </head>
    <body>
        <!--Cabeçalho-->
        <div class="cabecalho">
            <h1>Vamos começar com o cadastro!</h1>
        </div>
        <div class="dados-login">
            <form>
                <p class="input-container">
                    <input type="text" placeholder="Digite seu nome" class="input-field">
                    <label class="input-label" for="text">Digite seu nome</label>
                </p>
                <br>
                <p class="input-container">
                    <input type="password" placeholder="Digite sua senha" class="input-field">
                    <label class="input-label" for="text">Digite sua senha</label>
                </p>
                <br>
                <p class="input-container">
                    <input type="password" placeholder="Confirme sua senha" class="input-field">
                    <label class="input-label" for="text">Confirme sua senha</label>
                </p>
                <br>
                <p class="input-container">
                    <input type="email" placeholder="Digite seu email" class="input-field">
                    <label class="input-label" for="text">Digite seu email</label>
                </p>
                <br>
                <p class="input-container">
                    <input type="number" placeholder="Coloque seu telefone" class="input-field">
                    <label class="input-label" for="text">Coloque seu telefone</label>
                </p>
            </form>   
        </div>
        <!--botao-->
        <div class="confirmacao">
            <a href="../imagens/sabor motors.png" class="myButton">Confirmar</a>
        </div>
        <!--Rodapé-->
        <div class="rodape">
            <p>Nós da SABOR Motors temos total comprometimento com seus dados utilizando segurança de ponta para o maior cuidado.</p>
        </div>    
    </body>
</html>
