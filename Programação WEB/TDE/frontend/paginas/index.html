<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDE VITOR BONFIM</title>
    <link rel="stylesheet" href="../estilos/index.css">
</head>
<body>
    <header>
        <h1>SISTEMA DE GARAGEM</h1>
    </header>
    <!--Classe main para conseguir utilizar o flexbox de maneira correta-->
    <main class="container">
         <!--Inicio da div da area que o usuario poderá cadastrar os veículos-->
        <div class="area-cadastro">
            <div class="titulocad">
                <h3>INSIRA UM VEÍCULO!</h3>
            </div>
            <input type="text" id="modelo" placeholder="Digite o modelo do veículo!">
            <input type="text" id="marca" placeholder="Digite a marca do veículo!">
            <input type="number" id="ano" placeholder="Digite o ano do veículo!">
            <input type="number" step="0.01" id="preco" placeholder="Digite o preço do veículo!">
            <!--O step="0.01" permite que seja digitado valores decimais ou centavos ex: 85000.50-->
            <button id="btnconfirma">Confimar</button>
        </div>
         <!--Inicio da div da area que o usuario poderá ver os veículos-->
        <div class="area-tabela">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Modelo</th>
                        <th>Marca</th>
                        <th>Ano</th>
                        <th>Preço</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="corpotabela-carros">
                    <!-- Carro 1 de Teste -->
                        <tr>
                            <td>1</td>
                            <td>Onix</td>
                            <td>Chevrolet</td>
                            <td>2022</td>
                            <td>R$ 85.000,00</td>
                            <td>
                                <button class="btn-atualizar" id="btnatualizar">Atualizar</button>
                                <button id="btndelete" class="btn-excluir">Excluir</button>
                            </td>
                        </tr>

                        <!-- Carro 2 de Teste -->
                        <tr>
                            <td>2</td>
                            <td>Civic</td>
                            <td>Honda</td>
                            <td>2020</td>
                            <td>R$ 110.000,00</td>
                            <td>
                                <button class="btn-atualizar" id="btnatualizar">Atualizar</button>
                                <button id="btndelete" class="btn-excluir">Excluir</button>
                            </td>
                        </tr>

                        <!-- Carro 3 de Teste -->
                        <tr>
                            <td>3</td>
                            <td>Corolla</td>
                            <td>Toyota</td>
                            <td>2023</td>
                            <td>R$ 145.000,00</td>
                            <td>
                                <button class="btn-atualizar" id="btnatualizar">Atualizar</button>
                                <button id="btndelete" class="btn-excluir">Excluir</button>
                            </td>
                        </tr>
                </tbody>
            </table>
        </div>
        <div class="assinatura">
            <p>Feito por: Vitor Bonfim - Ciência da computação turma B</p>
        </div>
    </main>    
    <script src="../codigos/index.js" defer></script>
</body>
</html>
